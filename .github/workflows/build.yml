name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = "0.0.0-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish MomotalkAutoJP/MomotalkAutoJP.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md, README.ja.md, LICENSE publish/
          Compress-Archive -Path publish/* -DestinationPath "MomotalkAutoJP-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MomotalkAutoJP-${{ steps.ver.outputs.version }}
          path: publish/
          retention-days: 14

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: MomotalkAutoJP-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
